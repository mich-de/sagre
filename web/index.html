<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sagre/favicon.svg" />
    <!-- `viewport-fit=cover` porta la pagina sotto le tacche: i margini di
         sicurezza li rimette il CSS con env(safe-area-inset-*). Niente
         maximum-scale: lo zoom deve restare a disposizione di chi ci vede poco. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2E9D8" />
    <!-- Queste due righe sono l'unico posto dove il nome del sito è scritto a
         mano: qui non si può importare `src/lib/site.ts`, che è la sorgente per
         tutto il resto. Se cambia il nome, cambia anche qui. -->
    <meta name="description" content="Sagre, feste patronali, mercatini e concerti in piazza in penisola sorrentina, costiera amalfitana e dintorni. Il cartellone si aggiorna da solo." />
    <title>Eventi &amp; Sagre in penisola sorrentina e dintorni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,600..900;1,6..96,600..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
